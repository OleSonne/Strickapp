name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  app-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        working-directory: Strickapp.swiftpm
        run: |
          xcodebuild -list
          xcodebuild build -scheme Strickapp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
