<h2>Testschal</h2><p>Größen: klein (groß)</p><h2>Material</h2><p>Garn 50 (80) g</p>
<h2>ANLEITUNG</h2><p>Schlage 6 (8) M an.</p>
<p>Reihe 1 (Rück-R): Stricke alle M li.<br>Reihe 2 (Hin-R): 2 re, 1 M zunehmen, re bis zum Ende.</p>
<p>Stricke diese 2 Reihen insgesamt 4 (5) Mal. Nun liegen 10 (13) M auf der Nadel.</p><p>Kette alle M ab.</p></html>
